<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <linearGradient id="bgPa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="50%" style="stop-color:#0f0f23"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accentPa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="chartPa" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="scanlinePa" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:transparent"/>
      <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </linearGradient>
    <filter id="glowPa"><feGaussianBlur stdDeviation="2"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowStrongPa"><feGaussianBlur stdDeviation="4"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clipPa"><rect width="900" height="200" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clipPa)">
    <rect width="900" height="200" rx="16" fill="url(#bgPa)"/>
    <rect width="900" height="200" rx="16" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.2"/>
    <g opacity="0.03">
      <line x1="0" y1="50" x2="900" y2="50" stroke="#7c3aed" stroke-width="1"/>
      <line x1="0" y1="100" x2="900" y2="100" stroke="#7c3aed" stroke-width="1"/>
      <line x1="0" y1="150" x2="900" y2="150" stroke="#7c3aed" stroke-width="1"/>
    </g>
    <rect x="0" y="0" width="900" height="200" fill="url(#scanlinePa)" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <g transform="translate(60,105)">
      <g filter="url(#glowPa)">
        <g opacity="0.05">
          <line x1="-50" y1="-50" x2="50" y2="-50" stroke="#7c3aed" stroke-width="1"/>
          <line x1="-50" y1="-25" x2="50" y2="-25" stroke="#7c3aed" stroke-width="1"/>
          <line x1="-50" y1="0" x2="50" y2="0" stroke="#7c3aed" stroke-width="1"/>
          <line x1="-50" y1="25" x2="50" y2="25" stroke="#7c3aed" stroke-width="1"/>
          <line x1="-50" y1="50" x2="50" y2="50" stroke="#7c3aed" stroke-width="1"/>
          <line x1="-50" y1="-50" x2="-50" y2="50" stroke="#7c3aed" stroke-width="1"/>
          <line x1="0" y1="-50" x2="0" y2="50" stroke="#7c3aed" stroke-width="1"/>
          <line x1="50" y1="-50" x2="50" y2="50" stroke="#7c3aed" stroke-width="1"/>
        </g>
        <polyline points="-40,30 -25,20 -5,25 10,5 25,10 40,-15" fill="none" stroke="url(#accentPa)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <polygon points="-40,30 -25,20 -5,25 10,5 25,10 40,-15 40,45 -40,45" fill="url(#chartPa)"/>
        <circle cx="-40" cy="30" r="2.5" fill="#3b82f6"/>
        <circle cx="-25" cy="20" r="2.5" fill="#7c3aed"/>
        <circle cx="-5" cy="25" r="2.5" fill="#3b82f6"/>
        <circle cx="10" cy="5" r="2.5" fill="#7c3aed"/>
        <circle cx="25" cy="10" r="2.5" fill="#3b82f6"/>
        <circle cx="40" cy="-15" r="3.5" fill="url(#accentPa)">
          <animate attributeName="r" values="3.5;5.5;3.5" dur="1.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0.6;1" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="40" cy="-15" r="10" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0">
          <animate attributeName="r" values="6;18" dur="2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.4;0" dur="2s" repeatCount="indefinite"/>
        </circle>
        <circle r="1.5" fill="#3b82f6" opacity="0.6">
          <animate attributeName="cx" values="-40;40" dur="4s" repeatCount="indefinite"/>
          <animate attributeName="cy" values="30;-15" dur="4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.6;0" dur="4s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
    <g transform="translate(180,55)">
      <text x="0" y="0" font-family="monospace" font-size="28" font-weight="bold" fill="#7c3aed" filter="url(#glowStrongPa)">
        Predictive Analytics Pipeline
        <animate attributeName="opacity" values="1;0.92;1" dur="2.5s" repeatCount="indefinite"/>
      </text>
      <text x="0" y="0" font-family="monospace" font-size="28" font-weight="bold" fill="#7c3aed" opacity="0.2">
        <animate attributeName="opacity" values="0.2;0.5;0.2" dur="0.06s" repeatCount="indefinite"/>
        Predictive Analytics Pipeline
      </text>
      <text x="0" y="30" font-family="monospace" font-size="14" fill="#888" letter-spacing="3">CUSTOMER CHURN PREDICTION</text>
      <text x="0" y="55" font-family="monospace" font-size="11" fill="#666" letter-spacing="1">ML · XGBOOST · OCI FREE TIER · FLASK API</text>
    </g>
    <g transform="translate(780, 170)" opacity="0.35">
      <text font-family="monospace" font-size="9" fill="#7c3aed">ML</text>
    </g>
  </g>
</svg>